<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 404" role="img" aria-label="Signing in moves the owner from session id to user id while carrying the existing facts across.">
<style>:root{
    --paper:#E9ECEF;
    --panel:#FFFFFF;
    --ink:#141C24;
    --rule:#AEB8C2;
    --muted:#5B6772;
    --signal:#0A7361;
    --signal-tint:#EAF4F1;
    --chip:#F1F4F6;
    --sans:"Barlow","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
*{box-sizing:border-box}
/* ---- masthead ---- */
  .masthead{padding-bottom:28px;border-bottom:1.5px solid var(--ink);margin-bottom:48px}
.masthead h1{
    font-size:clamp(38px,7vw,66px);
    font-weight:700;
    letter-spacing:-0.025em;
    line-height:1;
    margin:0 0 18px;
  }
.lede{
    font-size:clamp(16px,2.1vw,20px);
    line-height:1.45;
    max-width:52ch;
    margin:0;
    color:var(--ink);
  }
.lede b{font-weight:600}
.meta{
    margin:22px 0 0;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.02em;
    color:var(--muted);
  }
/* ---- sheets ---- */
  .sheet{
    background:var(--panel);
    border:1px solid var(--rule);
    margin-bottom:40px;
  }
.titleblock{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:16px 22px 15px;
    border-bottom:1px solid var(--rule);
  }
.titleblock h2{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
.titleblock .idx{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
.field{
    overflow-x:auto;
    padding:26px 22px 30px;
    background-color:var(--panel);
    background-image:
      linear-gradient(to right, rgba(20,28,36,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,28,36,.05) 1px, transparent 1px);
    background-size:26px 26px;
  }
.field svg{display:block;width:100%;height:auto;min-width:760px}
.note{
    padding:15px 22px 17px;
    border-top:1px solid var(--rule);
    font-size:14.5px;
    line-height:1.5;
    color:var(--muted);
    max-width:74ch;
  }
.note b{color:var(--ink);font-weight:600}
.note code{font-family:var(--mono);font-size:13px;color:var(--ink)}
/* ---- svg type roles ---- */
  .t-title{font-family:var(--sans);font-size:19px;font-weight:600;fill:var(--ink)}
.t-boxtitle{font-family:var(--sans);font-size:17px;font-weight:600;fill:var(--ink)}
.t-stage{font-family:var(--sans);font-size:16.5px;font-weight:600;fill:var(--ink)}
.t-stage-r{font-family:var(--sans);font-size:16.5px;font-weight:600;fill:#FFFFFF}
.t-code{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.t-code-lg{font-family:var(--mono);font-size:14px;fill:var(--ink)}
.t-code-sm{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.t-code-mut{font-family:var(--mono);font-size:13px;fill:var(--muted)}
.t-code-r{font-family:var(--mono);font-size:13px;fill:#CBD5DD}
.t-note{font-family:var(--sans);font-size:13px;fill:var(--muted)}
.t-note-b{font-family:var(--sans);font-size:13.5px;font-weight:600;fill:var(--ink)}
.t-eyebrow{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.13em;fill:var(--muted)}
.t-edge{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
.t-edge-s{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;fill:var(--signal)}
.t-cap{font-family:var(--sans);font-size:14.5px;fill:var(--ink)}
.t-cap-mut{font-family:var(--sans);font-size:13.5px;fill:var(--muted)}
.t-badge{font-family:var(--mono);font-size:14px;fill:#FFFFFF}
.t-badge-r{font-family:var(--mono);font-size:14px;fill:var(--ink)}
.box{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.box-ink{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
.box-sig{fill:var(--signal-tint);stroke:var(--signal);stroke-width:1.75}
.chip{fill:var(--chip);stroke:var(--rule);stroke-width:1}
.edge{stroke:var(--ink);stroke-width:1.4;fill:none}
.edge-sig{stroke:var(--signal);stroke-width:1.75;fill:none}
.lead{stroke:var(--rule);stroke-width:1.25;stroke-dasharray:2 4;fill:none}
.hair{stroke:var(--rule);stroke-width:1}
.hair-ink{stroke:var(--ink);stroke-width:1}
.field{padding:18px 12px 22px}
.titleblock{padding:14px 16px}
.note{padding:14px 16px 16px}
}
.field{background-image:none}
}</style>
        <defs>
          <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#141C24"/>
          </marker>
        </defs>

        <text class="t-eyebrow" x="80" y="46">ANONYMOUS</text>
        <text class="t-eyebrow" x="440" y="46">SIGN IN</text>
        <text class="t-eyebrow" x="760" y="46">SIGNED IN</text>

        <!-- anonymous -->
        <rect class="box" x="80" y="68" width="300" height="160" rx="3"/>
        <text class="t-code-lg" x="104" y="112">owner = session_id</text>
        <path class="hair" d="M80,138 L380,138"/>
        <text class="t-note" x="104" y="166" font-size="11.5">facts</text>
        <text class="t-code-lg" x="104" y="194">home_city: dubai</text>

        <path class="edge" d="M380,148 L432,148" marker-end="url(#ah3)"/>

        <!-- sign in -->
        <rect class="box" x="440" y="98" width="260" height="100" rx="3"/>
        <text class="t-code-lg" x="464" y="138">POST /auth/login</text>
        <text class="t-code-mut" x="464" y="162">+ session_id</text>

        <path class="edge" d="M700,148 L752,148" marker-end="url(#ah3)"/>

        <!-- signed in -->
        <rect class="box" x="760" y="68" width="300" height="160" rx="3"/>
        <text class="t-code-lg" x="784" y="112">owner = user:&lt;id&gt;</text>
        <path class="hair" d="M760,138 L1060,138"/>
        <text class="t-note" x="784" y="166" font-size="11.5">facts</text>
        <text class="t-code-lg" x="784" y="194">home_city: dubai</text>

        <!-- adoption -->
        <path class="edge" d="M570,198 L570,234" marker-end="url(#ah3)"/>
        <text class="t-stage" x="570" y="262" text-anchor="middle">facts adopted</text>
        <text class="t-cap-mut" x="570" y="284" text-anchor="middle">existing account facts win</text>

        <path class="hair" d="M80,314 L1060,314"/>
        <text class="t-cap" x="570" y="344" text-anchor="middle">The conversation continues. It does not restart.</text>
        <text class="t-cap-mut" x="570" y="368" text-anchor="middle">Facts then follow the account to any browser.</text>
      </svg>