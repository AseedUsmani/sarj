<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 712" role="img" aria-label="System context: browser calls the Sarjy FastAPI service, which depends on SQLite, Groq and Open-Meteo.">
<style>:root{
    --paper:#E9ECEF;
    --panel:#FFFFFF;
    --ink:#141C24;
    --rule:#AEB8C2;
    --muted:#5B6772;
    --signal:#0A7361;
    --signal-tint:#EAF4F1;
    --chip:#F1F4F6;
    --sans:"Barlow","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
*{box-sizing:border-box}
/* ---- masthead ---- */
  .masthead{padding-bottom:28px;border-bottom:1.5px solid var(--ink);margin-bottom:48px}
.masthead h1{
    font-size:clamp(38px,7vw,66px);
    font-weight:700;
    letter-spacing:-0.025em;
    line-height:1;
    margin:0 0 18px;
  }
.lede{
    font-size:clamp(16px,2.1vw,20px);
    line-height:1.45;
    max-width:52ch;
    margin:0;
    color:var(--ink);
  }
.lede b{font-weight:600}
.meta{
    margin:22px 0 0;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.02em;
    color:var(--muted);
  }
/* ---- sheets ---- */
  .sheet{
    background:var(--panel);
    border:1px solid var(--rule);
    margin-bottom:40px;
  }
.titleblock{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:16px 22px 15px;
    border-bottom:1px solid var(--rule);
  }
.titleblock h2{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
.titleblock .idx{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
.field{
    overflow-x:auto;
    padding:26px 22px 30px;
    background-color:var(--panel);
    background-image:
      linear-gradient(to right, rgba(20,28,36,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,28,36,.05) 1px, transparent 1px);
    background-size:26px 26px;
  }
.field svg{display:block;width:100%;height:auto;min-width:760px}
.note{
    padding:15px 22px 17px;
    border-top:1px solid var(--rule);
    font-size:14.5px;
    line-height:1.5;
    color:var(--muted);
    max-width:74ch;
  }
.note b{color:var(--ink);font-weight:600}
.note code{font-family:var(--mono);font-size:13px;color:var(--ink)}
/* ---- svg type roles ---- */
  .t-title{font-family:var(--sans);font-size:19px;font-weight:600;fill:var(--ink)}
.t-boxtitle{font-family:var(--sans);font-size:17px;font-weight:600;fill:var(--ink)}
.t-stage{font-family:var(--sans);font-size:16.5px;font-weight:600;fill:var(--ink)}
.t-stage-r{font-family:var(--sans);font-size:16.5px;font-weight:600;fill:#FFFFFF}
.t-code{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.t-code-lg{font-family:var(--mono);font-size:14px;fill:var(--ink)}
.t-code-sm{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.t-code-mut{font-family:var(--mono);font-size:13px;fill:var(--muted)}
.t-code-r{font-family:var(--mono);font-size:13px;fill:#CBD5DD}
.t-note{font-family:var(--sans);font-size:13px;fill:var(--muted)}
.t-note-b{font-family:var(--sans);font-size:13.5px;font-weight:600;fill:var(--ink)}
.t-eyebrow{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.13em;fill:var(--muted)}
.t-edge{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
.t-edge-s{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;fill:var(--signal)}
.t-cap{font-family:var(--sans);font-size:14.5px;fill:var(--ink)}
.t-cap-mut{font-family:var(--sans);font-size:13.5px;fill:var(--muted)}
.t-badge{font-family:var(--mono);font-size:14px;fill:#FFFFFF}
.t-badge-r{font-family:var(--mono);font-size:14px;fill:var(--ink)}
.box{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.box-ink{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
.box-sig{fill:var(--signal-tint);stroke:var(--signal);stroke-width:1.75}
.chip{fill:var(--chip);stroke:var(--rule);stroke-width:1}
.edge{stroke:var(--ink);stroke-width:1.4;fill:none}
.edge-sig{stroke:var(--signal);stroke-width:1.75;fill:none}
.lead{stroke:var(--rule);stroke-width:1.25;stroke-dasharray:2 4;fill:none}
.hair{stroke:var(--rule);stroke-width:1}
.hair-ink{stroke:var(--ink);stroke-width:1}
.field{padding:18px 12px 22px}
.titleblock{padding:14px 16px}
.note{padding:14px 16px 16px}
}
.field{background-image:none}
}</style>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#141C24"/>
          </marker>
        </defs>

        <!-- browser -->
        <rect class="box" x="330" y="40" width="480" height="100" rx="3"/>
        <text class="t-title" x="356" y="76">Browser</text>
        <text class="t-code" x="356" y="102">Web Speech API</text>
        <text class="t-code-mut" x="356" y="124">localStorage: session_id + token</text>

        <!-- edges browser -> service -->
        <path class="edge" d="M420,140 L420,318" marker-end="url(#ah)"/>
        <path class="edge" d="M720,140 L720,318" marker-end="url(#ah)"/>

        <text class="t-code" x="406" y="196" text-anchor="end">POST /auth/register</text>
        <text class="t-code" x="406" y="218" text-anchor="end">POST /auth/login</text>
        <text class="t-code" x="406" y="240" text-anchor="end">GET /auth/me</text>
        <text class="t-note" x="406" y="266" text-anchor="end">returns an HMAC token</text>

        <text class="t-code" x="736" y="196">POST /chat</text>
        <text class="t-code" x="736" y="218">Authorization: Bearer …</text>
        <text class="t-note" x="736" y="244">optional</text>

        <!-- service -->
        <rect class="box" x="330" y="320" width="480" height="94" rx="3"/>
        <text class="t-title" x="356" y="358">Sarjy service</text>
        <text class="t-code-mut" x="356" y="386">FastAPI · one process</text>

        <!-- bus to dependencies -->
        <path class="edge" d="M570,414 L570,466"/>
        <path class="edge" d="M222,466 L912,466"/>
        <path class="edge" d="M222,466 L222,502" marker-end="url(#ah)"/>
        <path class="edge" d="M570,466 L570,502" marker-end="url(#ah)"/>
        <path class="edge" d="M912,466 L912,502" marker-end="url(#ah)"/>

        <!-- sqlite -->
        <rect class="box" x="72" y="506" width="300" height="150" rx="3"/>
        <text class="t-boxtitle" x="96" y="540">SQLite</text>
        <rect class="chip" x="96" y="558" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="156" y="578" text-anchor="middle">users</text>
        <rect class="chip" x="228" y="558" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="288" y="578" text-anchor="middle">facts</text>
        <rect class="chip" x="96" y="600" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="156" y="620" text-anchor="middle">cache_entries</text>
        <rect class="chip" x="228" y="600" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="288" y="620" text-anchor="middle">request_log</text>

        <!-- footnote on users -->
        <rect x="72" y="676" width="7" height="7" fill="#141C24"/>
        <text x="90" y="684"><tspan class="t-code-sm">users</tspan><tspan class="t-note" dx="8">scrypt hashes · HMAC tokens, no JWT library</tspan></text>

        <!-- groq -->
        <rect class="box" x="430" y="506" width="280" height="108" rx="3"/>
        <text class="t-boxtitle" x="454" y="540">Groq</text>
        <rect class="chip" x="454" y="558" width="110" height="30" rx="2"/>
        <text class="t-code-sm" x="509" y="578" text-anchor="middle">small tier</text>
        <rect class="chip" x="576" y="558" width="110" height="30" rx="2"/>
        <text class="t-code-sm" x="631" y="578" text-anchor="middle">large tier</text>

        <!-- open-meteo -->
        <rect class="box" x="762" y="506" width="300" height="108" rx="3"/>
        <text class="t-boxtitle" x="786" y="540">Open-Meteo</text>
        <rect class="chip" x="786" y="558" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="846" y="578" text-anchor="middle">geocode</text>
        <rect class="chip" x="918" y="558" width="120" height="30" rx="2"/>
        <text class="t-code-sm" x="978" y="578" text-anchor="middle">forecast</text>
      </svg>