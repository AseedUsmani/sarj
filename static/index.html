<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarjy</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b35; --text:#e6e8ec;
          --muted:#8a8f98; --accent:#6fcf97; --warn:#f0a63a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px 64px }
  header { display:flex; align-items:center; gap:14px; margin-bottom:22px }
  h1 { font-size:20px; margin:0 }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 0 }
  .orb { width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
         background:radial-gradient(circle at 35% 30%,#3a4152,#1b1f28); transition:.15s }
  .orb.listening { border-color:var(--accent); box-shadow:0 0 0 6px rgba(111,207,151,.12) }
  .orb.thinking  { border-color:var(--warn); animation:pulse 1.1s infinite }
  .orb.speaking  { background:radial-gradient(circle at 35% 30%,#6fcf97,#2f7d55) }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  button { background:#222733; color:var(--text); border:1px solid var(--line);
           border-radius:9px; padding:10px 16px; font-size:14px; cursor:pointer }
  button:hover:not(:disabled) { border-color:#3a4152 }
  button:disabled { opacity:.45; cursor:not-allowed }
  #mic.on { background:var(--accent); color:#0d1712; border-color:transparent; font-weight:600 }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px }
  #log { padding:16px; display:flex; flex-direction:column; gap:10px;
         min-height:220px; max-height:52vh; overflow-y:auto }
  .turn { max-width:80%; padding:9px 13px; border-radius:12px; white-space:pre-wrap }
  .turn.user { align-self:flex-end; background:#2b3a55; border-bottom-right-radius:4px }
  .turn.bot  { align-self:flex-start; background:#1f242e; border-bottom-left-radius:4px }
  .turn.err  { align-self:flex-start; background:#2a1618; color:#ffb4b4; border:1px solid #5a2a2e }
  .turn.pending { color:var(--muted) }
  .empty { color:var(--muted); margin:auto 0; font-size:14px }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line) }
  input[type=text] { flex:1; background:#12151b; border:1px solid var(--line);
                     border-radius:9px; padding:10px 12px; color:var(--text); font-size:14px }
  input[type=text]:focus { outline:none; border-color:#3a4152 }
  .panel { margin-top:14px; padding:14px 16px; font-size:13px }
  .panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.07em;
              color:var(--muted); margin:0 0 10px }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px }
  .k { color:var(--muted); font-size:11px }
  .v { font-variant-numeric:tabular-nums; font-size:15px }
  .v.hit { color:var(--accent) }
  .note { color:var(--muted); font-size:12px; margin-top:12px }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="orb" id="orb"></div>
    <div style="flex:1">
      <h1>Sarjy</h1>
      <p class="sub" id="status">ready</p>
    </div>
    <button id="mic">Start talking</button>
  </header>

  <div class="card">
    <div id="log"><div class="empty">
      Ask about the weather. Try “What’s the weather in Delhi?”, then ask it a
      different way to see a cache hit.
    </div></div>
    <form id="form">
      <input type="text" id="text" placeholder="or type here" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="card panel">
    <h2>Last request</h2>
    <div class="kv">
      <div><div class="k">served from</div><div class="v" id="m-cached">—</div></div>
      <div><div class="k">route</div><div class="v" id="m-route">—</div></div>
      <div><div class="k">intent</div><div class="v" id="m-intent">—</div></div>
      <div><div class="k">latency</div><div class="v" id="m-lat">—</div></div>
    </div>
    <p class="note" id="note">Voice needs Chrome. Typing works everywhere.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), orb = $('orb');

// Session id lives in localStorage: it is how cross-session memory is keyed.
// Not an identity — there are no accounts.
const sessionId = (() => {
  let s = localStorage.getItem('sarjy_session');
  if (!s) { s = crypto.randomUUID().replace(/-/g, '').slice(0, 24);
            localStorage.setItem('sarjy_session', s); }
  return s;
})();

let busy = false;

function setState(s, label) {
  orb.className = 'orb' + (s ? ' ' + s : '');
  $('status').textContent = label || s || 'ready';
}

function addTurn(cls, text) {
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'turn ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function showMetrics(d) {
  const cached = $('m-cached');
  cached.textContent = d.cached ? 'cache' : 'model';
  cached.className = 'v' + (d.cached ? ' hit' : '');
  $('m-route').textContent  = d.route  || '—';
  $('m-intent').textContent = d.intent || '—';
  $('m-lat').textContent    = d.latency_ms != null ? d.latency_ms + ' ms' : '—';
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  u.onstart = () => setState('speaking', 'speaking');
  u.onend   = () => setState('', 'ready');
  speechSynthesis.speak(u);
}

async function ask(text) {
  if (busy) return;
  busy = true;
  addTurn('user', text);
  const pending = addTurn('bot pending', '…');
  setState('thinking', 'thinking');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, text })
    });
    const data = await res.json();

    if (!res.ok) {
      pending.remove();
      addTurn('err', data.error?.message || 'Request failed');
      setState('', 'error');
      return;
    }
    pending.remove();
    addTurn('bot', data.answer);
    showMetrics(data);
    speak(data.answer);
  } catch (e) {
    pending.remove();
    addTurn('err', 'Could not reach the server.');
    setState('', 'error');
  } finally {
    busy = false;
  }
}

// ---- typing -------------------------------------------------------------
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('text').value.trim();
  if (!v) return;
  $('text').value = '';
  ask(v);
});

// ---- voice --------------------------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic');
let recog = null, listening = false;

if (!SR) {
  mic.disabled = true;
  mic.textContent = 'Voice unsupported';
  $('note').textContent = 'This browser has no Web Speech API. Use the text box, or open in Chrome.';
} else {
  recog = new SR();
  recog.lang = 'en-US';
  recog.interimResults = false;
  recog.continuous = false;      // one utterance per press; simplest correct thing

  recog.onstart  = () => { listening = true;  mic.classList.add('on');
                           mic.textContent = 'Listening…'; setState('listening', 'listening'); };
  recog.onresult = e => ask(e.results[0][0].transcript.trim());
  recog.onerror  = e => {
    const msg = e.error === 'not-allowed'
      ? 'Microphone permission denied. Typing still works.'
      : 'Speech error: ' + e.error;
    $('note').textContent = msg;
    setState('', 'ready');
  };
  recog.onend    = () => { listening = false; mic.classList.remove('on');
                           mic.textContent = 'Start talking';
                           if (!busy) setState('', 'ready'); };

  mic.addEventListener('click', () => {
    if (listening) { recog.stop(); return; }
    // Speaking over the reply should stop it.
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    try { recog.start(); } catch (_) { /* already starting */ }
  });
}
</script>
</body>
</html>
